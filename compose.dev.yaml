# Local development override: live-reload on source changes.
#   docker compose -f compose.yaml -f compose.dev.yaml up --build
services:
  api:
    command:
      - /app/.venv/bin/uvicorn
      - team_notes_api.main:create_app
      - --factory
      - --host=0.0.0.0
      - --port=8000
      - --reload
      - --reload-dir=/app/src
    volumes:
      - ./src:/app/src:ro
    restart: "no"
