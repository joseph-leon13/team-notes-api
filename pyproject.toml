[project]
name = "team-notes-api"
version = "0.1.0"
description = "REST backend for a note-taking service shared by small teams."
readme = "README.md"
authors = [
    { name = "Joseph Leon", email = "125853437+joseph-leon13@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.30",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "import-linter>=2.15",
    "pytest>=8",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.importlinter]
root_package = "team_notes_api"

[[tool.importlinter.contracts]]
name = "Layers: api > services > (schemas | models); core is infrastructure"
type = "layers"
layers = [
    "team_notes_api.api",
    "team_notes_api.services",
    "team_notes_api.schemas | team_notes_api.models",
]

[[tool.importlinter.contracts]]
name = "Policy is pure: no database, models, api or other services"
type = "forbidden"
source_modules = ["team_notes_api.services.policy"]
forbidden_modules = [
    "team_notes_api.core.db",
    "team_notes_api.models",
    "team_notes_api.api",
    "team_notes_api.services.users",
    "team_notes_api.services.teams",
    "team_notes_api.services.notes",
]

[[tool.importlinter.contracts]]
name = "Models know nothing about schemas, services or the API"
type = "forbidden"
source_modules = ["team_notes_api.models"]
forbidden_modules = [
    "team_notes_api.schemas",
    "team_notes_api.services",
    "team_notes_api.api",
]
